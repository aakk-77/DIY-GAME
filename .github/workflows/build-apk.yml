name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 下载中文字体 (Noto Sans SC)
        run: |
          mkdir -p mobile
          curl -L --fail -o mobile/font.otf \
            "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf"
          ls -lh mobile/font.otf

      - name: 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖与 Buildozer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              autoconf libtool pkg-config zlib1g-dev \
              cmake libffi-dev libssl-dev liblzma-dev \
              libsqlite3-dev libreadline-dev libbz2-dev \
              zip unzip git
          python3 -m pip install --upgrade pip
          python3 -m pip install --user buildozer cython

      - name: 缓存 Buildozer 工具链（SDK/NDK）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: 用 Buildozer 构建 APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export ANDROID_API=34
          export ANDROID_MINAPI=21
          export ARCHS=arm64-v8a
          export ANDROID_ACCEPT_SDK_LICENSE=1
          yes | buildozer android debug

      - name: 上传 APK 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pvzhybrid-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 GitHub Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
